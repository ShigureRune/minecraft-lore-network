<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft Lore Network</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#182b2a;background:#f5f7f5;--muted:#61726f;--accent:#236447}*{box-sizing:border-box}body{margin:0}header{height:64px;padding:10px 20px;display:flex;align-items:center;gap:13px;background:#172f29;color:#f0f7ed}.logo{width:34px;height:34px;display:grid;place-items:center;background:#73ac72;color:#172f29;font-weight:900;border-radius:8px}h1{font-size:18px;letter-spacing:.02em;margin:0}header small{color:#b9d5c3}header .version{margin-left:auto;font-size:12px}main{height:calc(100dvh - 64px);display:grid;grid-template-columns:280px minmax(0,1fr) 290px;min-height:0}.side{padding:18px;background:#fff;overflow:auto;border-right:1px solid #dbe3de}.detail{border-right:0;border-left:1px solid #dbe3de}h2{font-size:14px;margin:0 0 10px}h3{font-size:13px;margin:18px 0 8px;color:#41554b}input,select,button{font:inherit;color:inherit}input[type=search],select{width:100%;background:#f6f8f6;border:1px solid #cad5ce;border-radius:8px;padding:9px;font-size:14px}button{border:1px solid #c5d2c9;border-radius:7px;background:white;padding:8px 10px;cursor:pointer}button:hover{background:#eaf4ed}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #238636;outline-offset:2px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sub{font-size:12px;color:var(--muted);line-height:1.6}label{font-size:12px;display:block;margin:10px 0 5px}.legend{display:flex;align-items:center;gap:7px;font-size:12px;margin:6px 0}.swatch{width:9px;height:9px;border-radius:50%;display:inline-block}.line{width:24px;height:0;border-top:2px solid}.stage{position:relative;overflow:hidden;background:#fcfdfc;min-height:0;touch-action:none}.stage #map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}.stage #map:active{cursor:grabbing}.stage .node{cursor:pointer}.stage .node text{font-weight:650;paint-order:stroke;stroke:#fcfdfc;stroke-width:3px;stroke-linejoin:round}.stage .node:focus text,.stage .node.selected text{font-weight:900;stroke:#e1f5df;stroke-width:7px}.stage .edge text{paint-order:stroke;stroke:#fcfdfc;stroke-width:3px;stroke-linejoin:round}.stage .edge{opacity:.8;pointer-events:none}.stage .edge.active{opacity:1}.stage .edge.active path{stroke-width:2.8px}.stage .faded{opacity:.075!important}.stage .hidden{display:none}.stage.hide-labels .edge text{display:none}.tools{position:absolute;bottom:16px;left:16px;display:flex;gap:5px;background:#fff;border:1px solid #d5ded7;border-radius:9px;padding:5px;box-shadow:0 3px 12px #172f2910}.tools button{min-width:34px}.status{position:absolute;left:12px;top:12px;font-size:12px;background:#fffffff2;border:1px solid #d5ded7;border-radius:7px;padding:7px 10px;pointer-events:none}.matches{max-height:180px;overflow:auto}.match,.neighbor{display:block;text-align:left;width:100%;margin:4px 0;font-size:12px;line-height:1.5}.neighbor span{display:block;color:var(--muted);font-size:11px}.detail h2{font-size:18px;overflow-wrap:anywhere}.pill{display:inline-block;font-size:11px;background:#e9f0eb;padding:4px 7px;margin:2px;border-radius:5px}.mobile{display:none}.notice{background:#f2f6ef;border-radius:8px;padding:10px;font-size:12px;line-height:1.6}.drawer{display:none} @media(max-width:960px){main{grid-template-columns:230px minmax(0,1fr)}.detail{position:absolute;right:0;top:64px;bottom:0;width:min(300px,85vw);z-index:5;box-shadow:-4px 0 16px #182b2a20;display:none}.detail.open{display:block}.mobile{display:inline-block}} @media(max-width:650px){header{padding:9px 12px}h1{font-size:15px}header small{font-size:10px}header .version{display:none}main{display:block;position:relative}.stage{height:100%}.side:not(.detail){display:none;position:absolute;top:0;bottom:0;left:0;width:min(290px,85vw);z-index:6;box-shadow:4px 0 16px #182b2a20}.side.open:not(.detail){display:block}.detail{top:0}.drawer{display:block;margin-left:auto}.tools{bottom:12px;left:12px}.status{font-size:11px;max-width:90%}}
</style></head><body><header><div class="logo" aria-hidden="true">ML</div><div><h1>Minecraft Lore Network</h1><small>世界観・考察の知識ネットワーク</small></div><span class="version">GRAPH v1.05 / LORE v3.21</span><button class="drawer" id="openFilters" style="color:#182b2a">検索・絞込</button></header><main><aside class="side" id="filters"><div class="row"><h2>探索</h2><button class="mobile" id="closeFilters" aria-label="閉じる">×</button></div><input id="search" type="search" placeholder="項目・仮説番号を検索" aria-label="検索"><div id="matches" class="matches"></div><h3>フィルター</h3><label for="category">考察分野（文字色）</label><select id="category"><option value="">すべて</option></select><label for="medium">作品・媒体（下線）</label><select id="medium"><option value="">すべて</option><option value="?">不明・仮説のみ</option></select><label for="dimension">存在次元（左記号）</label><select id="dimension"><option value="">すべて</option><option value="?">不明</option></select><label for="kind">関係線</label><select id="kind"><option value="">すべて</option><option value="fact">記録された仕様・描写</option><option value="hyp">仮説・比較</option></select><label><input type="checkbox" id="labels"> 関係線の説明を常に表示</label><button id="clear">絞り込み解除</button><h3>色・記号の凡例</h3><div id="legend"></div><div class="legend"><span class="line" style="border-color:#8995a5"></span>記録された仕様・描写</div><div class="legend"><span class="line" style="border-color:#a16b21;border-top-style:dashed"></span>独自仮説・比較</div><p class="notice">非公式の考察資料です。色や下線は同一世界線や公式設定を意味しません。分類は暫定版です。</p><a class="sub" href="minecraft_lore_map.svg">元のSVG</a></aside><section class="stage" id="stage"><!-- GRAPH --><div class="status" id="status" aria-live="polite"></div><div class="tools"><button id="plus" aria-label="拡大">＋</button><button id="minus" aria-label="縮小">−</button><button id="fit">全体</button><button id="unselect">選択解除</button></div></section><aside class="side detail" id="detail"><div class="row"><h2>項目詳細</h2><button class="mobile" id="closeDetail">×</button></div><div id="content"><p class="sub">図の文字を選ぶと、作品・次元・関連項目と根拠番号がここに表示されます。</p><p class="sub">ドラッグで移動、スクロールまたはピンチで拡大・縮小。</p></div><h3>経路検索</h3><label for="from">出発項目</label><select id="from"><option value="">選択してください</option></select><label for="to">到達項目</label><select id="to"><option value="">選択してください</option></select><button id="route">経路を探す</button><div id="routeResult" class="sub"></div></aside></main><script>
'use strict';const DATA=/* GRAPH_DATA */;
const $=id=>document.getElementById(id),svg=$('map'),stage=$('stage');const categories={'#1859a0':'魂・経験値・付呪','#7945a5':'音・情報・シフト','#287449':'生命・召喚・回復','#007c83':'海洋・鉱物','#b44436':'汚染・災害','#87551c':'文明・勢力・技術','#475569':'次元・遺跡'},media={M:['本編','#238636'],D:['Dungeons','#e07a19'],D2:['Dungeons II','#a536dc'],L:['Legends','#168dc5'],F:['映画','#d43869'],N:['公式小説','#9b6a29']},dims={O:['オーバーワールド','#43a047','■'],N:['ネザー','#dc493a','▲'],E:['エンド','#a384cf','◆'],S:['シフト','#169caa','●'],X:['その他の次元','#657080','◇']};const nodes=new Map(DATA.nodes.map(n=>[n.id,n])),ne=id=>$('node_'+id),ee=e=>$(e.id);let selected=null,routeNodes=null,routeEdges=null,visible=new Set(nodes.keys());
const make=(tag,text,cls)=>{let el=document.createElement(tag);if(text!=null)el.textContent=text;if(cls)el.className=cls;return el};function opt(el,val,label){let o=make('option',label);o.value=val;el.append(o)}Object.entries(categories).forEach(([k,v])=>opt($('category'),k,v));Object.entries(media).forEach(([k,v])=>opt($('medium'),k,v[0]));Object.entries(dims).forEach(([k,v])=>opt($('dimension'),k,v[2]+' '+v[0]));[...nodes.values()].sort((a,b)=>a.label.localeCompare(b.label,'ja')).forEach(n=>{opt($('from'),n.id,n.label);opt($('to'),n.id,n.label)});function legend(label,c,s){let row=make('div',null,'legend'),mark=make('span',s||'●');mark.style.color=c;mark.style.minWidth='24px';row.append(mark,make('span',label));$('legend').append(row)}Object.entries(categories).forEach(([c,n])=>legend(n,c,'文字'));Object.values(media).forEach(([n,c])=>legend(n,c,'━'));Object.values(dims).forEach(([n,c,s])=>legend(n,c,s));
const adjacent=id=>DATA.edges.filter(e=>e.source===id||e.target===id);const other=(e,id)=>e.source===id?e.target:e.source;const kindOk=e=>!$('kind').value||($('kind').value==='hyp')===e.hypothesis;
function matches(n){let q=$('search').value.trim().toLocaleLowerCase();return !q||n.label.toLocaleLowerCase().includes(q)||adjacent(n.id).some(e=>e.label.toLocaleLowerCase().includes(q))}
function tagOk(a,v){return !v||(v==='?'?!a.length:a.includes(v))}function apply(){visible=new Set(DATA.nodes.filter(n=>(!$('category').value||n.color===$('category').value)&&tagOk(n.media,$('medium').value)&&tagOk(n.dimensions,$('dimension').value)).map(n=>n.id));let hit=new Set(DATA.nodes.filter(n=>visible.has(n.id)&&matches(n)).map(n=>n.id));let focus=routeNodes|| (selected?new Set([selected,...adjacent(selected).filter(kindOk).map(e=>other(e,selected))]):null);for(let n of DATA.nodes){let el=ne(n.id);el.classList.toggle('hidden',!visible.has(n.id));el.classList.toggle('faded',visible.has(n.id)&&((!hit.has(n.id))||(focus&&!focus.has(n.id))));el.classList.toggle('selected',n.id===selected)}let count=0;for(let e of DATA.edges){let el=ee(e),ok=visible.has(e.source)&&visible.has(e.target)&&kindOk(e);if(ok)count++;el.classList.toggle('hidden',!ok);let on=routeEdges?routeEdges.has(e.id):selected?e.source===selected||e.target===selected:!$('search').value||hit.has(e.source)&&hit.has(e.target);el.classList.toggle('faded',ok&&!on);el.classList.toggle('active',ok&&on&&!!(selected||routeEdges))}$('status').textContent=`${visible.size}/${nodes.size} 項目 · ${count}/${DATA.edges.length} 関係線${$('search').value?' · '+hit.size+'件一致':''}`;$('matches').replaceChildren();if($('search').value.trim()){for(let id of hit){let b=make('button',nodes.get(id).label,'match');b.onclick=()=>choose(id,true);$('matches').append(b)}if(!hit.size)$('matches').append(make('p','一致なし','sub'))}labelVisibility()}
function choose(id,center=false){selected=id;routeNodes=routeEdges=null;$('routeResult').textContent='';let n=nodes.get(id);$('content').replaceChildren();let heading=make('h2',n.label);heading.style.color=n.color;$('content').append(heading,make('p',categories[n.color]||'','sub'));for(let [label,tags,dict] of [['媒体',n.media,media],['存在次元',n.dimensions,dims]]){let p=make('p',label+': ','sub');if(!tags.length)p.append('不明');for(let t of tags)p.append(make('span',dict[t]?.[0]||t,'pill'));$('content').append(p)}if(n.origin||n.originNote)$('content').append(make('p','起源情報：'+(n.originNote||n.origin),'notice'));$('content').append(make('h3','関連項目'));for(let e of adjacent(id)){let target=other(e,id),b=make('button',nodes.get(target).label,'neighbor');b.append(make('span',(e.hypothesis?'仮説・比較：':'記録：')+e.label));b.onclick=()=>choose(target,true);$('content').append(b)}$('from').value=id;$('detail').classList.add('open');$('filters').classList.remove('open');if(center)centerOn(id);apply()}
for(let n of DATA.nodes){let el=ne(n.id);el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',n.label);el.addEventListener('click',()=>{if(!dragged)choose(n.id)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(n.id,true)}});let b=el.getBBox(),r=document.createElementNS('http://www.w3.org/2000/svg','rect');for(let [k,v] of Object.entries({x:b.x-6,y:b.y-5,width:b.width+12,height:b.height+10,fill:'transparent'}))r.setAttribute(k,v);el.insertBefore(r,el.firstChild)}
for(let id of ['search','category','medium','dimension','kind','labels'])$(id).addEventListener(id==='search'?'input':'change',()=>{routeNodes=routeEdges=null;apply()});$('clear').onclick=()=>{for(let id of ['search','category','medium','dimension','kind'])$(id).value='';selected=routeNodes=routeEdges=null;apply()};$('unselect').onclick=()=>{selected=routeNodes=routeEdges=null;$('routeResult').textContent='';$('content').replaceChildren(make('p','項目を選択してください。','sub'));apply()};$('openFilters').onclick=()=>$('filters').classList.toggle('open');$('closeFilters').onclick=()=>$('filters').classList.remove('open');$('closeDetail').onclick=()=>$('detail').classList.remove('open');
$('route').onclick=()=>{let a=$('from').value,b=$('to').value;if(!a||!b){$('routeResult').textContent='2項目を選んでください。';return}if(!visible.has(a)||!visible.has(b)){$('routeResult').textContent='選んだ項目は現在のフィルターで非表示です。';return}let queue=[a],prev=new Map([[a,null]]);for(let i=0;i<queue.length&&!prev.has(b);i++)for(let e of adjacent(queue[i]).filter(kindOk)){let v=other(e,queue[i]);if(visible.has(v)&&!prev.has(v)){prev.set(v,{id:queue[i],edge:e});queue.push(v)}}if(!prev.has(b)){$('routeResult').textContent='現在の条件では経路なし';return}routeNodes=new Set([b]);routeEdges=new Set();let path=[b],v=b;while(prev.get(v)){let p=prev.get(v);routeEdges.add(p.edge.id);routeNodes.add(p.id);v=p.id;path.unshift(v)}selected=null;$('routeResult').textContent=path.map(id=>nodes.get(id).label).join(' → ')+'（方向を問わない関連経路。因果関係を保証しません）';apply();fit()};
// SVG viewBox pan / zoom. Coordinates account for letterboxing using screen CTM.
let original=svg.getAttribute('viewBox').split(/\s+/).map(Number),view=[...original],dragged=false,pointers=new Map(),lastPinch=null;function setView(){svg.setAttribute('viewBox',view.join(' '));labelVisibility()}function labelVisibility(){stage.classList.toggle('hide-labels',!$('labels').checked&&!selected&&!routeEdges&&view[2]>original[2]*.55)}function fit(){view=[...original];setView()}function point(x,y){let p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(svg.getScreenCTM().inverse())}function zoom(f,x,y){let p=point(x,y),nw=Math.max(original[2]/18,Math.min(original[2]*2,view[2]*f)),r=nw/view[2];view=[p.x+(view[0]-p.x)*r,p.y+(view[1]-p.y)*r,nw,view[3]*r];setView()}function centerOn(id){let el=ne(id),b=el.getBBox(),p=svg.createSVGPoint();p.x=b.x+b.width/2;p.y=b.y+b.height/2;p=p.matrixTransform(el.getCTM()).matrixTransform(svg.getCTM().inverse());let w=original[2]*.29,h=w*original[3]/original[2];view=[p.x-w/2,p.y-h/2,w,h];setView()}
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(Math.max(-100,Math.min(100,e.deltaY))*.004),e.clientX,e.clientY)},{passive:false});svg.addEventListener('pointerdown',e=>{if(pointers.size===0)dragged=false;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let [a,b]=pointers.values();lastPinch=Math.hypot(a.x-b.x,a.y-b.y);dragged=true}});svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);let dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let [a,b]=pointers.values();let d=Math.hypot(a.x-b.x,a.y-b.y);if(lastPinch>0&&d>0)zoom(lastPinch/d,(a.x+b.x)/2,(a.y+b.y)/2);lastPinch=d;dragged=true;return}if(Math.abs(dx)+Math.abs(dy)>2||dragged){dragged=true;let a=point(old.x,old.y),b=point(e.clientX,e.clientY);view[0]+=a.x-b.x;view[1]+=a.y-b.y;setView()}});function up(e){pointers.delete(e.pointerId);lastPinch=null}window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);function centerZoom(f){let b=svg.getBoundingClientRect();zoom(f,b.x+b.width/2,b.y+b.height/2)}$('plus').onclick=()=>centerZoom(.7);$('minus').onclick=()=>centerZoom(1/.7);$('fit').onclick=fit;apply();
</script></body></html>
