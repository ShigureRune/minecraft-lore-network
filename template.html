<header><div class="logo">ML</div><div><h1>Minecraft Lore Network</h1><small>考察キャンバス · v0.7.2</small></div><span class="version">GRAPH v1.07 / LORE v3.21</span><a href="legacy.html">従来の全体図 ↗</a></header>
<div class="workspace">
<aside class="panel catalogPanel" id="catalogPanel"><div class="row space"><h2>項目を追加</h2><button class="mobile" id="closeCatalog" aria-label="閉じる">×</button></div><input id="search" type="search" placeholder="項目・仮説番号を検索" aria-label="項目検索"><label for="cat">考察分野</label><select id="cat"><option value="">すべて</option></select><label for="media">作品・媒体</label><select id="media"><option value="">すべて</option><option value="?">不明・仮説</option></select><label for="dim">次元</label><select id="dim"><option value="">すべて</option><option value="?">不明</option></select><div class="muted" id="resultsCount"></div><div id="catalog" class="catalog"></div></aside>
<main class="stage" id="stage"><svg id="canvas" role="application" aria-label="考察相関図キャンバス" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c5d6c9"/></pattern></defs><rect id="backdrop" width="100%" height="100%" fill="#f8faf7"/><g id="world"><rect x="-100000" y="-100000" width="200000" height="200000" fill="url(#dots)" pointer-events="none"/><g id="edges"></g><g id="nodes"></g></g></svg>
<div class="toolbar"><button class="primary" id="addPanel">＋ 項目</button><button id="showAll">全項目を表示</button><button id="arrange">自動配置</button><button id="clearCanvas">空にする</button><button id="reset">初期例</button><button id="toggleLabels" aria-pressed="false">関係ラベル</button><span class="count" id="count"></span></div>
<div id="empty" class="empty hidden">左上の「＋ 項目」から考察したい項目を追加できます。</div><div class="zoom"><button id="minus" aria-label="縮小">−</button><button id="plus" aria-label="拡大">＋</button><button id="fit">全体表示</button></div><div class="help">項目をドラッグして移動／背景をドラッグして移動／ピンチ・ホイールで拡大縮小</div></main>
<aside class="panel inspector" id="inspector"><div class="row space"><h2>関連情報</h2><button class="mobile" id="closeInspector" aria-label="閉じる">×</button></div><div id="detail"></div><h3>表示する関係</h3><label><input id="showFact" type="checkbox" checked> 資料に記録された仕様・描写</label><label><input id="showHyp" type="checkbox" checked> 独自仮説・比較</label><div class="legend"><i></i>矢印の色：関連する項目のテーマ色</div><p class="muted">記録・仮説の区別は表示切替と関係詳細で確認できます。</p><p class="notice">矢印は既存の考察資料にある関連を示します。矢印の向き・色は公式設定の確度や因果関係を保証しません。文字色・媒体の下線・次元記号は従来の分類です。</p><a href="minecraft_lore_map.svg" class="muted">元の全体SVG</a></aside></div>
<script>
'use strict';
const DATA=/* GRAPH_DATA */;
const $=id=>document.getElementById(id),svg=$('canvas'),world=$('world'),nodeLayer=$('nodes'),edgeLayer=$('edges');
const cat={'#1859a0':'魂・経験値・付呪','#7945a5':'音・情報・シフト','#287449':'生命・召喚・回復','#007c83':'海洋・鉱物','#b44436':'汚染・災害','#87551c':'文明・勢力・技術','#475569':'次元・遺跡'},media={M:['本編','#238636'],D:['Dungeons','#e07a19'],D2:['Dungeons II','#a536dc'],L:['Legends','#168dc5'],F:['映画','#d43869'],N:['公式小説','#9b6a29']},dims={O:['オーバーワールド','#43a047','■'],N:['ネザー','#dc493a','▲'],E:['エンド','#a384cf','◆'],S:['シフト','#169caa','●'],X:['その他','#657080','◇']};
const byId=new Map(DATA.nodes.map(n=>[n.id,n])),adj=new Map(DATA.nodes.map(n=>[n.id,[]]));for(const e of DATA.edges){adj.get(e.source).push(e);adj.get(e.target).push(e)}
const other=(e,id)=>e.source===id?e.target:e.source;
const el=(tag,text,cls)=>{let x=document.createElement(tag);if(text!=null)x.textContent=text;if(cls)x.className=cls;return x};
const S=(tag,attrs={},text)=>{let x=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let [k,v] of Object.entries(attrs))x.setAttribute(k,v);if(text!=null)x.textContent=text;return x};
const option=(a,v,t)=>{let o=el('option',t);o.value=v;a.append(o)};
Object.entries(cat).forEach(([k,v])=>option($('cat'),k,v));Object.entries(media).forEach(([k,v])=>option($('media'),k,v[0]));Object.entries(dims).forEach(([k,v])=>option($('dim'),k,v[2]+' '+v[0]));
const placed=new Map(),nodeEls=new Map(),edgeEls=new Map();let selected=null,selectedEdge=null,camera={x:0,y:0,k:1},labels=false;
const nodeSizes=new Map(DATA.nodes.map(n=>{let length=[...n.label].reduce((a,c)=>a+(c.charCodeAt(0)>127?15:9),0);return[n.id,{w:Math.max(130,length+22+n.dimensions.length*12),h:54}]}));const size=id=>nodeSizes.get(id);
const tagOk=(v,k)=>!k||(k==='?'?!v.length:v.includes(k));
function allowed(e){return e.hypothesis?$('showHyp').checked:$('showFact').checked}
function currentEdges(){return DATA.edges.filter(e=>placed.has(e.source)&&placed.has(e.target)&&allowed(e))}
function button(text,fn,cls){let b=el('button',text,cls);b.onclick=fn;return b}
function save(){try{localStorage.setItem('minecraft-lore-canvas-v1',JSON.stringify({nodes:[...placed],camera,labels,selected,fact:$('showFact').checked,hyp:$('showHyp').checked}))}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem('minecraft-lore-canvas-v1'));if(!s||!Array.isArray(s.nodes))return false;for(const pair of s.nodes){let [id,p]=pair;if(byId.has(id)&&Number.isFinite(p.x)&&Number.isFinite(p.y))placed.set(id,{x:p.x,y:p.y})}if(s.camera&&[s.camera.x,s.camera.y,s.camera.k].every(Number.isFinite)&&s.camera.k>0)camera={x:s.camera.x,y:s.camera.y,k:Math.max(.02,Math.min(3,s.camera.k))};labels=!!s.labels;selected=placed.has(s.selected)?s.selected:null;$('showFact').checked=s.fact!==false;$('showHyp').checked=s.hyp!==false;return true}catch(e){return false}}
function center(){let r=svg.getBoundingClientRect();return{x:(r.width/2-camera.x)/camera.k,y:(r.height/2-camera.y)/camera.k}}
function setCamera(){world.setAttribute('transform','translate('+camera.x+' '+camera.y+') scale('+camera.k+')')}
function point(x,y){let r=svg.getBoundingClientRect();return{x:(x-r.left-camera.x)/camera.k,y:(y-r.top-camera.y)/camera.k}}
function overlaps(id,p,exclude){let a=size(id);for(const [k,q] of placed){if(k===exclude||k===id)continue;let b=size(k);if(Math.abs(p.x-q.x)<(a.w+b.w)/2+30&&Math.abs(p.y-q.y)<(a.h+b.h)/2+30)return true}return false}
function locate(id,anchor){let near=adj.get(id).map(e=>other(e,id)).filter(k=>placed.has(k)),p=anchor&&placed.has(anchor)?placed.get(anchor):near.length?{x:near.reduce((a,k)=>a+placed.get(k).x,0)/near.length,y:near.reduce((a,k)=>a+placed.get(k).y,0)/near.length}:center();for(let r=near.length||anchor?140:0;r<=4500;r+=75){for(let i=0;i<(r?24:1);i++){let a=i*Math.PI/12,q={x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r};if(!overlaps(id,q))return q}}return{x:p.x+2000,y:p.y+2000}}
function add(id,anchor=null,quiet=false){if(!byId.has(id))return;if(!placed.has(id))placed.set(id,locate(id,anchor));if(!quiet){selected=id;selectedEdge=null;render();ensureVisible(id);save()}}
function remove(id){placed.delete(id);if(selected===id)selected=null;selectedEdge=null;render();save()}
function initial(){placed.clear();for(const [id,x,y] of [['builders',0,0],['soul',-230,-130],['xp',-230,100],['ancient',235,-130],['note',235,100]])if(byId.has(id))placed.set(id,{x,y});selected=null;selectedEdge=null;render();fit();save()}
function refreshCatalog(){let q=$('search').value.trim().toLowerCase();let matches=DATA.nodes.filter(n=>(!$('cat').value||n.color===$('cat').value)&&tagOk(n.media,$('media').value)&&tagOk(n.dimensions,$('dim').value)&&(!q||n.label.toLowerCase().includes(q)||adj.get(n.id).some(e=>e.label.toLowerCase().includes(q))));$('resultsCount').textContent=matches.length+' / '+DATA.nodes.length+' 項目';let frag=document.createDocumentFragment();for(let n of matches){let row=el('div',null,'item'),name=el('span',n.label,'name');name.style.color=n.color;row.append(name,button(placed.has(n.id)?'表示':'＋',()=>{if(placed.has(n.id)){select(n.id);ensureVisible(n.id)}else add(n.id,selected);if(innerWidth<=650)$('catalogPanel').classList.remove('open')}));frag.append(row)}$('catalog').replaceChildren(frag)}
function detail(){let root=$('detail');root.replaceChildren();if(selectedEdge){let e=DATA.edges.find(e=>e.id===selectedEdge);if(e){root.append(el('h2',byId.get(e.source).label+' — '+byId.get(e.target).label),el('div',(e.hypothesis?'仮説・比較｜':'記録｜')+e.label,'rel'+(e.hypothesis?' hyp':'')));for(let id of [e.source,e.target])root.append(button(byId.get(id).label,()=>select(id)));return}}if(!selected||!placed.has(selected)){root.append(el('p','項目を選ぶと、まだ配置していない関連項目も追加できます。','muted'));return}let n=byId.get(selected),title=el('h2',n.label);title.style.color=n.color;root.append(title,el('div',cat[n.color]||'','muted'));let tags=el('div',null,'tags');for(let m of n.media)tags.append(el('span',media[m]?.[0]||m,'tag'));for(let k of n.dimensions)tags.append(el('span',(dims[k]?.[2]||'')+' '+(dims[k]?.[0]||k),'tag'));root.append(tags);if(n.originNote)root.append(el('p',n.originNote,'notice'));let row=el('div',null,'row');row.append(button('この項目を外す',()=>remove(n.id)),button('関連をすべて追加',()=>{let id=n.id;for(let e of adj.get(id).filter(allowed))add(other(e,id),id,true);selected=id;render();fit();save()}));root.append(row,el('h3','直接の関連項目（'+adj.get(n.id).filter(allowed).length+'本）'));let groups=new Map();for(let e of adj.get(n.id).filter(allowed)){let k=other(e,n.id);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}for(let [id,rels] of groups){let a=byId.get(id),card=el('div',null,'neighbor'),name=el('div',a.label,'name');name.style.color=a.color;card.append(name);for(let e of rels)card.append(el('div',(e.hypothesis?'仮説・比較｜':'記録｜')+e.label,'rel'+(e.hypothesis?' hyp':'')));card.append(button(placed.has(id)?'この項目を見る':'＋ 追加',()=>{if(placed.has(id)){select(id);ensureVisible(id)}else add(id,n.id)}));root.append(card)}}
function select(id){selected=id;selectedEdge=null;updateHighlights();detail();$('inspector').classList.add('open');save()}
function selectEdge(id){selected=null;selectedEdge=id;updateHighlights();detail();$('inspector').classList.add('open')}
function updateHighlights(){for(let [id,g] of nodeEls)g.classList.toggle('selected',id===selected);for(let [id,g] of edgeEls){let e=g.e,on=selectedEdge===id||selected&&(e.source===selected||e.target===selected);g.g.classList.toggle('active',!!on);g.g.classList.toggle('dim',!!(selected||selectedEdge)&&!on)}svg.classList.toggle('show-labels',labels);$('toggleLabels').setAttribute('aria-pressed',String(labels))}
function makeNode(id){let n=byId.get(id),z=size(id),g=S('g',{class:'node',tabindex:'0',role:'button','aria-label':n.label,'data-id':id});g.append(S('rect',{class:'body',x:-z.w/2,y:-z.h/2,width:z.w,height:z.h,rx:9}),S('rect',{x:-z.w/2+3,y:-z.h/2+6,width:3,height:z.h-12,rx:1.5,fill:n.color}));let marks=n.dimensions.length*12,tx=-z.w/2+12;for(let [i,k] of n.dimensions.entries())g.append(S('text',{x:tx+i*12,y:5,fill:dims[k]?.[1]||'#777','font-size':11},dims[k]?.[2]||'·'));g.append(S('text',{x:tx+marks,y:5,fill:n.color,'font-size':15},n.label));let u=n.media.length?(z.w-26)/n.media.length:0;n.media.forEach((k,i)=>g.append(S('line',{x1:-z.w/2+13+i*u,x2:-z.w/2+11+(i+1)*u,y1:16,y2:16,stroke:media[k]?.[1]||'#777','stroke-width':3,'stroke-linecap':'round'})));g.append(S('title',{},n.label));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id)}});nodeLayer.append(g);nodeEls.set(id,g)}
const edgePalette={'#1859a0':'#168da7','#7945a5':'#9256c5','#287449':'#39934d','#007c83':'#168d82','#b44436':'#c24b46','#87551c':'#a67335','#475569':'#68758d'};
const edgeColorById={soul:'#168da7',xp:'#6a8b21',bottle:'#6a8b21',enchant:'#9256c5',points:'#9256c5',soulblock:'#168da7',soul_sync:'#168da7',flames:'#e0842f',prismarine:'#168d82',conduit:'#169eb0',conduit_power:'#169eb0',sculk:'#185b74',redstone:'#cb3939',redstone_golem:'#cb3939',gold:'#b58a17',void:'#6950a6',end:'#6950a6',nether:'#bd4e33',sift:'#9256c5',corruption:'#b43b67'};
const edgeColor=id=>edgeColorById[id]||edgePalette[byId.get(id).color]||byId.get(id).color||'#68758d';
function makeEdge(e){
  const key='edgepaint-'+edgeEls.size, start=edgeColor(e.source),end=edgeColor(e.target);
  let g=S('g',{class:'edge'+(e.hypothesis?' hyp':''),'data-edge':e.id}),defs=S('defs'),gradient=S('linearGradient',{id:key,gradientUnits:'userSpaceOnUse'}),marker=S('marker',{id:key+'-tip',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:4,markerHeight:4,orient:'auto',markerUnits:'strokeWidth'}),v=S('path',{class:'visible',stroke:start===end?start:'url(#'+key+')','marker-end':'url(#'+key+'-tip)'}),hit=S('path',{class:'hit'}),text=S('text',{'text-anchor':'middle'},e.label);
  gradient.append(S('stop',{offset:'0%','stop-color':start}),S('stop',{offset:'100%','stop-color':end}));
  marker.append(S('path',{d:'M0 0 L10 5 L0 10 Z',fill:end}));
  defs.append(gradient,marker);
  g.append(defs,v,hit,text,S('title',{},byId.get(e.source).label+' — '+e.label+' — '+byId.get(e.target).label));
  edgeLayer.append(g);edgeEls.set(e.id,{e,g,v,hit,text,gradient});
}
function geometry(){for(let [id,g] of nodeEls){let p=placed.get(id);g.setAttribute('transform','translate('+p.x+' '+p.y+')')}for(let {e,v,hit,text,gradient} of edgeEls.values()){let a=placed.get(e.source),b=placed.get(e.target),dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,z1=size(e.source),z2=size(e.target);let clip=z=>Math.min((z.w/2+2)/Math.max(Math.abs(ux),.00001),(z.h/2+2)/Math.max(Math.abs(uy),.00001),l*.42),s=clip(z1),t=clip(z2),x=a.x+ux*s,y=a.y+uy*s,X=b.x-ux*t,Y=b.y-uy*t;let k=Math.min(22,l*.045),mx=(x+X)/2-uy*k,my=(y+Y)/2+ux*k,path='M'+x+','+y+' Q'+mx+','+my+' '+X+','+Y;gradient.setAttribute('x1',x);gradient.setAttribute('y1',y);gradient.setAttribute('x2',X);gradient.setAttribute('y2',Y);v.setAttribute('d',path);hit.setAttribute('d',path);text.setAttribute('x',(x+X+2*mx)/4);text.setAttribute('y',(y+Y+2*my)/4-7)}}
function render(){nodeLayer.replaceChildren();edgeLayer.replaceChildren();nodeEls.clear();edgeEls.clear();for(let e of currentEdges())makeEdge(e);for(let id of placed.keys())makeNode(id);geometry();updateHighlights();setCamera();refreshCatalog();detail();$('count').textContent=placed.size+'項目 / '+currentEdges().length+'本';$('empty').classList.toggle('hidden',placed.size>0)}
function fit(){let r=svg.getBoundingClientRect();if(!placed.size){camera={x:r.width/2,y:r.height/2,k:1};setCamera();return}let l=Infinity,t=Infinity,R=-Infinity,B=-Infinity;for(let [id,p] of placed){let z=size(id);l=Math.min(l,p.x-z.w/2);R=Math.max(R,p.x+z.w/2);t=Math.min(t,p.y-z.h/2);B=Math.max(B,p.y+z.h/2)}let top=document.querySelector('.toolbar').getBoundingClientRect().bottom-r.top+10,bottom=60,usableHeight=Math.max(20,r.height-top-bottom);let k=Math.max(.02,Math.min(1.25,Math.max(20,r.width-40)/(R-l+40),usableHeight/(B-t+40)));camera={k,x:r.width/2-(l+R)/2*k,y:top+usableHeight/2-(t+B)/2*k};setCamera()}
function ensureVisible(id){let p=placed.get(id),r=svg.getBoundingClientRect();if(!p)return;let x=p.x*camera.k+camera.x,y=p.y*camera.k+camera.y,z=size(id);if(x-z.w*camera.k/2<15||x+z.w*camera.k/2>r.width-15||y<70||y>r.height-30){camera.x=r.width/2-p.x*camera.k;camera.y=r.height/2-p.y*camera.k;setCamera()}}
function showAll(){
  selected=selectedEdge=null;$('showFact').checked=true;$('showHyp').checked=true;$('catalogPanel').classList.remove('open');$('inspector').classList.remove('open');
  if(placed.size===DATA.nodes.length){render();fit();save();return}
  // Seed a compact, category-grouped layout before running the existing relationship-aware solver.
  const nodes=[...DATA.nodes].sort((a,b)=>a.color.localeCompare(b.color)),cols=Math.ceil(Math.sqrt(nodes.length)),stepX=Math.max(...nodes.map(n=>size(n.id).w))+45;
  placed.clear();nodes.forEach((n,i)=>placed.set(n.id,{x:(i%cols-(cols-1)/2)*stepX,y:(Math.floor(i/cols)-(Math.ceil(nodes.length/cols)-1)/2)*100}));
  arrange();
}
function arrange(){let ids=[...placed.keys()],e=currentEdges(),ps=ids.map(id=>({...placed.get(id)})),ix=new Map(ids.map((id,i)=>[id,i]));if(!ids.length)return;for(let iter=0;iter<180;iter++){let fx=ids.map(()=>0),fy=ids.map(()=>0);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){let a=ps[i],b=ps[j],dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)+Math.abs(dy)<.001){dx=1;dy=1}let l=Math.hypot(dx,dy),f=30000/(l*l+300);let zx=size(ids[i]),zy=size(ids[j]);let ox=(zx.w+zy.w)/2+32-Math.abs(dx),oy=86-Math.abs(dy);if(ox>0&&oy>0){if(ox<oy){let f=(Math.sign(dx)||1)*ox*.25;fx[i]-=f;fx[j]+=f}else{let f=(Math.sign(dy)||1)*oy*.3;fy[i]-=f;fy[j]+=f}}fx[i]-=dx/l*f;fy[i]-=dy/l*f;fx[j]+=dx/l*f;fy[j]+=dy/l*f}for(let a of e){let i=ix.get(a.source),j=ix.get(a.target),dx=ps[j].x-ps[i].x,dy=ps[j].y-ps[i].y,l=Math.hypot(dx,dy)||1,target=Math.max(140,(size(ids[i]).w+size(ids[j]).w)/2+45),f=(l-target)*.055*(a.hypothesis?1:1.3);fx[i]+=dx/l*f;fy[i]+=dy/l*f;fx[j]-=dx/l*f;fy[j]-=dy/l*f}for(let i=0;i<ids.length;i++){ps[i].x+=Math.max(-14,Math.min(14,fx[i]));ps[i].y+=Math.max(-14,Math.min(14,fy[i]))}}placed.clear();for(let i=0;i<ids.length;i++){let id=ids[i],p=ps[i],q=p;if(overlaps(id,p)){outer:for(let r=30;r<1800;r+=30)for(let a=0;a<24;a++){q={x:p.x+Math.cos(a*Math.PI/12)*r,y:p.y+Math.sin(a*Math.PI/12)*r};if(!overlaps(id,q))break outer}}placed.set(id,q)}render();fit();save()}
let pointers=new Map(),drag=null,pinch=null;
function zoomAt(f,x,y){let r=svg.getBoundingClientRect(),p=point(x,y),k=Math.max(.02,Math.min(3,camera.k*f));camera={x:x-r.left-p.x*k,y:y-r.top-p.y*k,k};setCamera()}
svg.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;let n=e.target.closest('[data-id]'),ed=e.target.closest('[data-edge]');pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);if(pointers.size===2){let [a,b]=pointers.values();pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2};drag=null;return}drag={id:n?.dataset.id||null,edge:ed?.dataset.edge||null,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,moved:false};if(drag.id){let p=placed.get(drag.id);drag.p={...p}}});
svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){let [a,b]=pointers.values(),distance=Math.hypot(a.x-b.x,a.y-b.y),x=(a.x+b.x)/2,y=(a.y+b.y)/2;if(pinch.distance>0)zoomAt(distance/pinch.distance,x,y);camera.x+=x-pinch.x;camera.y+=y-pinch.y;setCamera();pinch={distance,x,y};return}if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>4)drag.moved=true;if(drag.moved){if(drag.id){let p=placed.get(drag.id);p.x+=dx/camera.k;p.y+=dy/camera.k;geometry()}else{camera.x+=dx;camera.y+=dy;setCamera()}}drag.x=e.clientX;drag.y=e.clientY});
function release(e,cancel=false){pointers.delete(e.pointerId);if(pinch){pinch=null;drag=null;save();return}if(drag&&!drag.moved&&!cancel){if(drag.id)select(drag.id);else if(drag.edge)selectEdge(drag.edge);else{selected=selectedEdge=null;updateHighlights();detail();$('inspector').classList.remove('open')}}drag=null;save()}
svg.addEventListener('pointerup',e=>release(e));svg.addEventListener('pointercancel',e=>release(e,true));svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-Math.max(-150,Math.min(150,e.deltaY))*.003),e.clientX,e.clientY);save()},{passive:false});
for(let id of ['search','cat','media','dim'])$(id).addEventListener(id==='search'?'input':'change',refreshCatalog);for(let id of ['showFact','showHyp'])$(id).onchange=()=>{selectedEdge=null;render();save()};
$('addPanel').onclick=()=>{$('catalogPanel').classList.toggle('open');if(innerWidth>650||$('catalogPanel').classList.contains('open'))$('search').focus()};$('closeCatalog').onclick=()=>$('catalogPanel').classList.remove('open');$('closeInspector').onclick=()=>$('inspector').classList.remove('open');
$('showAll').onclick=showAll;$('arrange').onclick=arrange;$('clearCanvas').onclick=()=>{if(placed.size&&!confirm('キャンバスの配置だけを消しますか？ 元データは残ります。'))return;placed.clear();selected=selectedEdge=null;render();fit();save()};$('reset').onclick=initial;$('toggleLabels').onclick=()=>{labels=!labels;updateHighlights();save()};$('fit').onclick=()=>{fit();save()};for(let [id,f] of [['plus',1.25],['minus',.8]])$(id).onclick=()=>{let r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2);save()};
if(load()){render();if(!placed.size)fit()}else initial();
</script></body></html>
